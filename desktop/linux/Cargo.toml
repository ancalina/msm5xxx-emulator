[package]
name = "msm5xxx-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-2.0-or-later"
build = "build.rs"

[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_22"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_9", "gtk_v4_22"] }
serde_json = "1.0"
futures-channel = "0.3"
base64 = "0.22"
libc = "0.2"

[build-dependencies]
gdk-pixbuf = "=0.22.0"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
