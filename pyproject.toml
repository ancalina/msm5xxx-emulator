[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msm5xxx-emulator"
version = "0.1.0a0"
description = "Experimental Qualcomm MSM5xxx feature-phone emulator powered by QEMU TCG"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ancalina"}]
license = {text = "GPL-2.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
]
dependencies = [
    "Pillow>=10,<13",
    "numpy>=1.26,<3",
]

[project.scripts]
msm5xxx-qemu = "msm5xxx_emulator.qemu.live_display:main"
msm5xxx-condition-report = "msm5xxx_emulator.tools.condition_report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
