name: Build Windows installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.0-rc

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            bison curl diffutils flex git make patch tar
            mingw-w64-x86_64-gcc mingw-w64-x86_64-glib2
            mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
      - name: Build the project QEMU runtime
        shell: msys2 {0}
        run: packaging/windows/build-qemu.sh "$PWD/.ci-native"
      - name: Build complete installers and update metadata from the tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python packaging/release.py --tag "$env:RELEASE_TAG" --platform windows
          --runtime .ci-native/runtime --output artifacts/windows
      - name: Upload installers, update feed and checksums
        uses: actions/upload-artifact@v4
        with:
          name: MSM5xxx-windows-installers
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.nupkg
            artifacts/windows/releases.win.json
            artifacts/windows/release.json
            artifacts/windows/SHA256SUMS
            artifacts/windows/test-results/
          if-no-files-found: error
          retention-days: 30
