name: Build QEMU for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - engine/qemu-tcg-alpha-20260809

permissions:
  contents: read

env:
  QEMU_VERSION: 10.2.1
  BUNDLE_NAME: msm5xxx-qemu-windows-x86_64

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            bison
            curl
            diffutils
            flex
            git
            make
            patch
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python

      - name: Build patched QEMU
        run: |
          set -euxo pipefail
          workflow_qemu_version="$QEMU_VERSION"
          . experiments/qemu-tcg/qemu_build_inputs.env
          test "$workflow_qemu_version" = "$QEMU_VERSION"
          work="$PWD/.ci-windows"
          source="$work/qemu-${QEMU_VERSION}-msm5xxx"
          build="$work/build"
          archive="$work/qemu-${QEMU_VERSION}.tar.xz"
          work_native="$(cygpath -m "$work")"
          mkdir -p "$work" "$build"
          curl -fL --retry 3 \
            "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" \
            -o "$archive"
          MSYS=winsymlinks:sys \
            experiments/qemu-tcg/stage_qemu_source.sh "$archive" "$source"
          mkdir "$source/subprojects/dtc"
          git -C "$source/subprojects/dtc" init
          git -C "$source/subprojects/dtc" config core.autocrlf false
          git -C "$source/subprojects/dtc" fetch --depth 1 \
            "$QEMU_DTC_URL" "$QEMU_DTC_REVISION"
          git -C "$source/subprojects/dtc" checkout --detach FETCH_HEAD
          test "$(git -C "$source/subprojects/dtc" rev-parse HEAD)" = \
            "$QEMU_DTC_REVISION"
          cd "$build"
          "$source/configure" \
            --target-list=arm-softmmu \
            --without-default-features \
            --enable-fdt=internal \
            --disable-download \
            --disable-docs \
            --disable-tools \
            --disable-guest-agent \
            --disable-werror \
            --disable-debug-info \
            --extra-cflags="-ffile-prefix-map=$work=. -ffile-prefix-map=$work_native=." \
            --enable-strip
          ninja qemu-system-arm.exe

      - name: Assemble runtime and DLL closure
        run: |
          set -euxo pipefail
          work="$PWD/.ci-windows"
          source="$work/qemu-${QEMU_VERSION}-msm5xxx"
          bundle="$PWD/dist/$BUNDLE_NAME"
          mkdir -p "$bundle/bin" "$bundle/docs" "$bundle/experiments/qemu-tcg"
          cp "$work/build/qemu-system-arm.exe" "$bundle/bin/"
          cp run_windows.bat requirements.txt README.md README.ko.md \
            LICENSE THIRD_PARTY_NOTICES.md "$bundle/"
          cp -a src "$bundle/"
          cp experiments/qemu-tcg/live-display.py \
            experiments/qemu-tcg/qemu_transport.py \
            experiments/qemu-tcg/gdb_remote.py \
            experiments/qemu-tcg/README.md "$bundle/experiments/qemu-tcg/"
          cp docs/QEMU_TCG_BACKEND.md "$bundle/docs/"
          cp "$source/COPYING" "$bundle/QEMU_COPYING"

          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import shutil
          import subprocess
          import sys

          bundle = Path("dist") / os.environ["BUNDLE_NAME"]
          target = (bundle / "bin").resolve()
          available = {
              path.name.casefold(): path
              for path in (Path(sys.prefix) / "bin").glob("*.dll")
          }
          pending = [target / "qemu-system-arm.exe"]
          copied = set()
          while pending:
              binary = pending.pop()
              output = subprocess.run(
                  ["objdump", "-p", str(binary)], check=True,
                  capture_output=True, text=True, errors="replace",
              ).stdout
              for name in re.findall(r"^\s*DLL Name:\s*(\S+)", output, re.M):
                  key = name.casefold()
                  source = available.get(key)
                  if source is None or key in copied:
                      continue
                  destination = target / source.name
                  shutil.copy2(source, destination)
                  copied.add(key)
                  pending.append(destination)
          (bundle / "DLLS.txt").write_bytes(
              ("\n".join(sorted(path.name for path in target.glob("*.dll"))) + "\n").encode()
          )
          PY

          owners="$(while IFS= read -r dll; do
            pacman -Qqo "$MINGW_PREFIX/bin/$dll"
          done < "$bundle/DLLS.txt" | sort -u)"
          test -n "$owners"
          {
            echo "Bundled MinGW runtime packages:"
            for package in $owners; do
              pacman -Q "$package"
              echo "source: https://packages.msys2.org/package/$package"
            done
          } > "$bundle/MSYS2_PACKAGES.txt"
          for package in $owners; do
            while IFS= read -r license; do
              test -f "$license" || continue
              relative="${license#"$MINGW_PREFIX/share/licenses/"}"
              mkdir -p "$bundle/licenses/msys2/$(dirname "$relative")"
              cp "$license" "$bundle/licenses/msys2/$relative"
            done < <(pacman -Ql "$package" | awk '$2 ~ /\/share\/licenses\// {print $2}')
          done

          {
            cat "$source/MSM5XXX_STAGING_INFO"
            cat <<EOF
          QEMU_UPSTREAM=https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz
          PROJECT_COMMIT=$GITHUB_SHA
          EOF
          } > "$bundle/BUILDINFO.txt"

      - name: Smoke test isolated bundle
        run: |
          set -euxo pipefail
          bundle="$PWD/dist/$BUNDLE_NAME"
          saved_path="$PATH"
          PATH="$bundle/bin:/c/Windows/System32:/c/Windows"
          "$bundle/bin/qemu-system-arm.exe" --version \
            > "$bundle/QEMU_VERSION.txt" 2>&1
          "$bundle/bin/qemu-system-arm.exe" -machine help \
            > "$bundle/QEMU_MACHINES.txt" 2>&1
          PATH="$saved_path"
          grep -Fxq "QEMU emulator version $QEMU_VERSION" "$bundle/QEMU_VERSION.txt"
          grep -q '^msm5xxx-poc ' "$bundle/QEMU_MACHINES.txt"
          cd "$bundle"
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Windows launcher source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          $env:PYTHONPATH = "src;."
          python -m unittest discover -s tests -p "test_qemu_input_transport.py" -v
          python -m unittest discover -s tests -p "test_qemu_audio_transport.py" -v
          python -m unittest discover -s tests -p "test_gui_locale.py" -v
          $bundle = (Resolve-Path "dist/$env:BUNDLE_NAME").Path
          $env:PYTHONPATH = "$bundle/src;$bundle"
          python "$bundle/experiments/qemu-tcg/live-display.py" --help | Out-Null

      - name: Pack corresponding source
        run: |
          set -euxo pipefail
          work="$PWD/.ci-windows"
          name="qemu-${QEMU_VERSION}-msm5xxx"
          tar --exclude='*/.git' --exclude='*/.git/**' \
            --exclude='*/__pycache__' --exclude='*.pyc' \
            -cJf "dist/$name.tar.xz" -C "$work" "$name"
          (cd dist && sha256sum "$name.tar.xz" > "$name.tar.xz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: dist/${{ env.BUNDLE_NAME }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: msm5xxx-qemu-${{ env.QEMU_VERSION }}-corresponding-source
          path: |
            dist/qemu-${{ env.QEMU_VERSION }}-msm5xxx.tar.xz
            dist/qemu-${{ env.QEMU_VERSION }}-msm5xxx.tar.xz.sha256
          if-no-files-found: error
          retention-days: 30
