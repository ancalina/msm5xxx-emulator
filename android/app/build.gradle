plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "org.msm5xxx.emulator"
    compileSdk 35
    ndkVersion "28.2.13676358"
    buildFeatures { compose true }

    defaultConfig {
        applicationId "org.msm5xxx.emulator"
        minSdk 28
        targetSdk 35
        versionCode providers.gradleProperty("releaseVersionCode").orElse("20000").get().toInteger()
        versionName providers.gradleProperty("releaseVersion").orElse("0.2.0-rc").get()
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DPYTHON_PREFIX_DIR=$rootDir/build/vendor-src/python-3.14.4-android/prefix"
            }
        }
    }

    def signingNames = ["MSM5XXX_ANDROID_KEYSTORE", "MSM5XXX_ANDROID_KEY_ALIAS",
                        "MSM5XXX_ANDROID_STORE_PASSWORD", "MSM5XXX_ANDROID_KEY_PASSWORD"]
    def signingValues = signingNames.collect { System.getenv(it) }
    if (signingValues.any { it } && !signingValues.every { it }) {
        throw new GradleException("Set all Android release signing environment variables")
    }
    signingConfigs {
        release {
            if (signingValues.every { it }) {
                storeFile file(signingValues[0])
                keyAlias signingValues[1]
                storePassword signingValues[2]
                keyPassword signingValues[3]
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        release {
            if (signingValues.every { it }) { signingConfig signingConfigs.release }
        }
        // Keep test installs separate from the owner's signed app and private data.
        debug { applicationIdSuffix ".debug" }
    }

    sourceSets {
        main {
            res.srcDir "$buildDir/generated/chip-icons/res"
            assets.srcDir "$rootDir/build/generated/python-assets"
            jniLibs.srcDir "$rootDir/build/generated/jniLibs"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/c/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Python's stdlib contains required directories whose names start with '_'.
    aaptOptions.ignoreAssetsPattern = "android-testbed-dont-ignore-anything"
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.04.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.10.1"
}

// The marking includes the current checkout and date, so regenerate on every build.
def generateAppIcons = tasks.register("generateAppIcons", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine "python3", "branding/mobile_icons.py", "android", "$buildDir/generated/chip-icons"
    outputs.dir "$buildDir/generated/chip-icons"
    outputs.upToDateWhen { false }
}
tasks.named("preBuild").configure { dependsOn generateAppIcons }
